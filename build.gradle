plugins {
  alias(libs.plugins.spotless) apply false
  alias(libs.plugins.opts)
  alias(libs.plugins.buildinfra) apply false
  alias(libs.plugins.benmanes.versions)
}

apply plugin: com.carrotsearch.gradle.buildinfra.testing.TestingEnvPlugin

// Configured in gradle/scripts/publishing-sonatype-central.gradle
apply plugin: com.carrotsearch.gradle.buildinfra.publishing.mavencentral.MavenCentralPublishingPlugin
apply from: file('gradle/scripts/publishing-sonatype-central.gradle')

buildOptions {
  addOption("project.version", "Project version")
}

def projectVersion = buildOptions["project.version"].get()
def versionCatalog = libs

allprojects {
  group = 'com.carrotsearch.randomizedtesting'
  version = projectVersion
}

// Don't suggest pre-release upgrades (milestones, RCs, etc.) for dependencies on stable versions.
def isPreRelease = { String v -> v =~ /(?i)[.-](alpha|beta|rc|cr|m|ea|preview|snapshot)[.\d-]*$/ }

tasks.named("dependencyUpdates").configure {
  gradleReleaseChannel = "current"
  rejectVersionIf {
    isPreRelease(it.candidate.version) && !isPreRelease(it.currentVersion)
  }
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'com.diffplug.spotless'
  apply plugin: versionCatalog.plugins.opts.get().getPluginId()
  apply plugin: com.carrotsearch.gradle.buildinfra.testing.TestingEnvPlugin

  repositories {
    mavenCentral()
  }

  java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    modularity.inferModulePath = true
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Werror'
  }

  spotless {
    java {
      googleJavaFormat(versionCatalog.versions.googleJavaFormat.get())
    }
  }

  tasks.register('tidy') {
    dependsOn tasks.named('spotlessApply')
  }

  testing {
    suites {
      test {
        useJUnitJupiter(versionCatalog.versions.junit)
      }
    }
  }
}
